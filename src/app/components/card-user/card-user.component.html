<div class="card" style="border-radius: 15px; background-color: rgba(0, 0, 0, 0.6);">
  <div class="card-body text-center text-white">
    <div class="mt-6 mb-8">
      <img
        src="https://9669f0748807c02bebfa-1d529e27d70978c2b79448c725df2738.ssl.cf1.rackcdn.com/82663606_l.jpg"
        class="rounded-circle img-fluid"
        style="width: 100px; border: 2px solid #ffffff;"
      />
    </div>

    <!-- Nombre con tamaño y color -->
    <h4 class="mb-2" style="color: #080808; font-size: 2.6rem; background-color:springgreen;">
      {{ user().name.firstname }} {{ user().name.lastname }}
    </h4>

    <!-- Usuario y correo -->
    <p class="mb-4" style="font-size: 1rem; color: #cfd8dc;">
      {{ user().username }} <span class="mx-2">|</span>
      <a href="mailto:{{ user().email }}" style="color: #81d4fa;">
        {{ user().email }}
      </a>
    </p>

    <!-- Contraseña -->
    <p class="text-center" style="font-size: 1rem; color: #ffcc80;">
      {{ user().password }}
    </p>

    <!-- Datos adicionales -->
    <div class="d-flex justify-content-between text-center mt-5 mb-2">
      <div>
        <p class="mb-2" style="font-size: 1.1rem; color: #b3e5fc;">Telephone</p>
        <p class="mb-0" style="color: #e0f7fa;">{{ user().phone }}</p>
      </div>
      <div>
        <p class="mb-2" style="font-size: 1.1rem; color: #b39ddb;">City</p>
        <p class="mb-0" style="color: #d1c4e9;">{{ user().address.city }}</p>
      </div>
      <div>
        <p class="mb-2" style="font-size: 1.1rem; color: #ffe082;">Address</p>
        <p class="mb-0" style="color: #ffecb3;">
          {{ user().address.street }} {{ user().address.number }}
        </p>
      </div>
    </div>
  </div>
</div>
